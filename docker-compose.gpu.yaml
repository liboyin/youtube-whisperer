version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace/youtube_whisperer
      - ~/.whisper:/home/vscode/.whisper
    environment:
      - ASR_CUDA=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
