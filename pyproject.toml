version = "0.0.1"
description = "Download video and run speech recognition"
requires-python = ">=3.11"
authors = [
  {name = "Libo Yin", email = "liboyin830@gmail.com"}
]
dependencies = [
  "ctranslate2",
  "faster-whisper",
  "ffmpeg-python"
]
