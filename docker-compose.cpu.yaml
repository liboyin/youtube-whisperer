x-build: &build
  context: .
  additional_contexts:
    # Shared apt/pip install scripts, pinned to an immutable tag. Set BUILD_COMMON_CONTEXT
    # in .env to a local clone to build offline, or to test a change to the helpers before
    # it is tagged.
    build_common: "${BUILD_COMMON_CONTEXT:-https://github.com/liboyin/docker-build-common.git#v1.0.0}"
  args:
    # Optional caching proxies. Default to empty (direct internet); set in .env to use a proxy.
    APT_PROXY: ${APT_PROXY:-}
    PYPI_PROXY: ${PYPI_PROXY:-}

x-volumes: &volumes
  # Whisper model cache; defaults to a named volume so models persist across rebuilds. This names
  # only the host side of the mount, so it is distinct from the WHISPER_MODELS_DIR setting that
  # tells the app where the cache lives inside the container (/home/ubuntu/.whisper).
  - ${WHISPER_MODELS_VOLUME:-whisper_models}:/home/ubuntu/.whisper
  # Media library; defaults to the repo's ./assets directory. Override with a host path in .env.
  - ${ASSETS_DIR:-./assets}:/workspaces/youtube-whisperer/assets
  # Firefox profile for yt-dlp cookies; defaults to an empty named volume (no cookies).
  # Set FIREFOX_PROFILE_DIR to a host profile directory to download private/age-gated videos.
  - ${FIREFOX_PROFILE_DIR:-firefox_profile}:/home/ubuntu/snap/firefox/common/.mozilla/firefox

services:
  app:
    build: *build
    container_name: youtube-whisperer-app
    init: true
    restart: unless-stopped
    volumes: *volumes
    environment:
      WHISPER_USE_CUDA: '0'
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8001:8001"
    # uvicorn youtube_whisperer.api.app:app --host 0.0.0.0 --port 8001 --log-level debug
    entrypoint: ["uvicorn", "youtube_whisperer.api.app:app", "--host", "0.0.0.0", "--port", "8001", "--log-level", "debug"]

  youtube_worker:
    build: *build
    init: true
    restart: unless-stopped
    volumes: *volumes
    environment:
      WHISPER_USE_CUDA: '0'
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: ["python", "-m", "youtube_whisperer.workers", "youtube"]

  whisper_worker:
    build: *build
    init: true
    restart: unless-stopped
    volumes: *volumes
    environment:
      WHISPER_USE_CUDA: '0'
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: ["python", "-m", "youtube_whisperer.workers", "whisper"]

  azure_worker:
    build: *build
    init: true
    restart: unless-stopped
    volumes: *volumes
    environment:
      WHISPER_USE_CUDA: '0'
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: ["python", "-m", "youtube_whisperer.workers", "azure"]

  redis:
    image: redis:7
    container_name: youtube-whisperer-redis
    restart: unless-stopped
    volumes:
      - redis_vol:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      # Grace period before failing checks count: Redis is still starting up right after
      # container create, so failures during this window are ignored (a passing check ends
      # the grace period early and marks the service healthy).
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_vol:
  whisper_models:
  firefox_profile:
