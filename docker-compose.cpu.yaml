x-build-args: &build-args
  APT_PROXY: http://192.168.0.4:3142
  PYPI_PROXY: http://192.168.0.4:3141/root/pypi/+simple/

x-volumes: &volumes
  - ~/.whisper:/home/ubuntu/.whisper
  - /media/libo-smallfiles/Transcode:/workspaces/youtube-whisperer/assets
  - ~/snap/firefox/common/.mozilla/firefox:/home/ubuntu/snap/firefox/common/.mozilla/firefox

services:
  app:
    build:
      context: .
      args: *build-args
    container_name: youtube-whisperer-app
    init: true
    restart: unless-stopped
    volumes: *volumes
    environment:
      WHISPER_USE_CUDA: '0'
    env_file:
      - .env
    depends_on:
      - redis
    ports:
      - "8001:8001"
    # uvicorn youtube_whisperer.api.app:app --host 0.0.0.0 --port 8001 --log-level debug
    entrypoint: ["uvicorn", "youtube_whisperer.api.app:app", "--host", "0.0.0.0", "--port", "8001", "--log-level", "debug"]

  youtube_worker:
    build:
      context: .
      args: *build-args
    init: true
    restart: unless-stopped
    volumes: *volumes
    environment:
      WHISPER_USE_CUDA: '0'
    env_file:
      - .env
    depends_on:
      - redis
    entrypoint: ["python", "-m", "youtube_whisperer.workers", "youtube"]

  whisper_worker:
    build:
      context: .
      args: *build-args
    init: true
    restart: unless-stopped
    volumes: *volumes
    environment:
      WHISPER_USE_CUDA: '0'
    env_file:
      - .env
    depends_on:
      - redis
    entrypoint: ["python", "-m", "youtube_whisperer.workers", "whisper"]

  azure_worker:
    build:
      context: .
      args: *build-args
    init: true
    restart: unless-stopped
    volumes: *volumes
    environment:
      WHISPER_USE_CUDA: '0'
    env_file:
      - .env
    depends_on:
      - redis
    entrypoint: ["python", "-m", "youtube_whisperer.workers", "azure"]

  redis:
    image: redis:latest
    pull_policy: always
    container_name: youtube-whisperer-redis
    restart: unless-stopped
    volumes:
      - redis_vol:/data

volumes:
  redis_vol:
