services:
  app:
    build:
      context: .
    container_name: youtube-whisperer-app
    volumes:
      - .:/workspaces/youtube-whisperer
      - ~/.whisper:/home/ubuntu/.whisper
      # FIXME: this does not work on MacOS
      - /media/libo/Videos/Transcode:/workspaces/youtube-whisperer/assets
      - ~/snap/firefox/common/.mozilla/firefox:/home/ubuntu/snap/firefox/common/.mozilla/firefox
    environment:
      WHISPER_USE_CUDA: '0'
    depends_on:
      - redis
    ports:
      - "8000:8000"
    entrypoint: ["uvicorn", "youtube_whisperer.fastapi_app:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "debug"]

  worker:
    build:
      context: .
    container_name: youtube-whisperer-worker
    volumes:
      - ~/.whisper:/home/ubuntu/.whisper
      - /media/libo/Videos/Transcode:/workspaces/youtube-whisperer/assets
      - ~/snap/firefox/common/.mozilla/firefox:/home/ubuntu/snap/firefox/common/.mozilla/firefox
    environment:
      WHISPER_USE_CUDA: '0'
    depends_on:
      - redis
    entrypoint: ["python", "-m", "youtube_whisperer.worker"]

  redis:
    image: redis:latest
    container_name: youtube-whisperer-redis
    volumes:
      - redis_vol:/data

volumes:
  redis_vol:
