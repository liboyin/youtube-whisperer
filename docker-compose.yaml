services:
  app:
    extends:
      file: docker-compose.cpu.yaml
      service: app
    environment:
      WHISPER_USE_CUDA: '1'
      WHISPER_MODEL: large-v3
    runtime: nvidia

  worker:
    extends:
      file: docker-compose.cpu.yaml
      service: worker
    environment:
      WHISPER_USE_CUDA: '1'
      WHISPER_MODEL: large-v3
    runtime: nvidia
    healthcheck:
      test: ["CMD", "nvidia-smi"]
      interval: 60s
      timeout: 10s
      start_period: 30s

  redis:
    extends:
      file: docker-compose.cpu.yaml
      service: redis

volumes:
  redis_vol:
